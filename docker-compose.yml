# NOT VERIFIED in the build environment (no Docker available there). Review before use.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: trustshare, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}", POSTGRES_DB: trustshare }
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      TS_DATABASE_URL: "postgresql+psycopg://trustshare:${DB_PASSWORD}@db:5432/trustshare"
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: [objects:/app/data]
volumes: { dbdata: {}, objects: {} }
