version: '3.8'

# ==============================================================================
# TrustShare - Multi-Container Orchestration Stack
# Services: PostgreSQL (DB), Redis (Cache), FastAPI (Backend), Next.js (Frontend)
# ==============================================================================

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: trustshare_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustshare_secure_db_pass
      POSTGRES_DB: TrustShare_Users
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TrustShare_Users"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustshare_network

  # 2. Redis Session & Rate-Limiting Cache
  redis:
    image: redis:7-alpine
    container_name: trustshare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustshare_network

  # 3. FastAPI Backend (Cryptographic Vault & APIs)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustshare_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "TrustShare"
      API_V1_STR: "/api/v1"
      SECRET_KEY: "trustshare_dev_super_secret_key_2026_change_in_prod"
      POSTGRES_SERVER: "db"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "trustshare_secure_db_pass"
      POSTGRES_DB: "TrustShare_Users"
      DATABASE_URL: "postgresql+psycopg2://postgres:trustshare_secure_db_pass@db:5432/TrustShare_Users"
      REDIS_URL: "redis://redis:6379/0"
      MONGODB_URL: "${MONGODB_URL}"
      MONGODB_DB_NAME: "TrustShare_Logs"
      UPLOAD_DIR: "uploads"
      MAX_FILE_SIZE_MB: 50
      STORAGE_BACKEND: "s3"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_REGION:-ap-southeast-2}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-trustshare-vault-sanjith}"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trustshare_network

  # 4. Next.js Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustshare_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    depends_on:
      - backend
    networks:
      - trustshare_network

# ==============================================================================
# Persistent Named Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  trustshare_network:
    driver: bridge

