version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trustshare_postgres
    restart: always
    environment:
      POSTGRES_USER: trustshare_user
      POSTGRES_PASSWORD: trustshare_password
      POSTGRES_DB: trustshare_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: trustshare_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: trustshare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data: